<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES CNES - Sistema de Análise de Estabelecimentos de Saúde</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js para o Gráfico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/Style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">SAES CNES</a>
        <span class="navbar-text text-white">
            Sistema de Análise de Estabelecimentos de Saúde
        </span>
    </div>
</nav>

<div class="container">

    <!-- Formulário de Cadastro e Edição -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0" id="formTitle">Cadastrar Estabelecimento</h5>
        </div>
        <div class="card-body">
            <form id="formEstabelecimento">
                <input type="hidden" id="id">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label for="codigoCnes" class="form-label">Código CNES</label>
                        <input type="text" class="form-control" id="codigoCnes" required maxlength="20">
                    </div>
                    <div class="col-md-9">
                        <label for="nomeEstabelecimento" class="form-label">Nome do Estabelecimento</label>
                        <input type="text" class="form-control" id="nomeEstabelecimento" required maxlength="255">
                    </div>
                    <div class="col-md-2">
                        <label for="uf" class="form-label">UF</label>
                        <input type="text" class="form-control" id="uf" required maxlength="2" placeholder="Ex: SP">
                    </div>
                    <div class="col-md-4">
                        <label for="municipio" class="form-label">Município</label>
                        <input type="text" class="form-control" id="municipio" required maxlength="150">
                    </div>
                    <div class="col-md-3">
                        <label for="tipoEstabelecimento" class="form-label">Tipo de Estabelecimento</label>
                        <input type="text" class="form-control" id="tipoEstabelecimento" maxlength="100">
                    </div>
                    <div class="col-md-3">
                        <label for="esferaAdministrativa" class="form-label">Esfera Administrativa</label>
                        <input type="text" class="form-control" id="esferaAdministrativa" maxlength="100">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="atendeSus">
                            <label class="form-check-label" for="atendeSus">
                                Atende SUS
                            </label>
                        </div>
                    </div>
                    <div class="col-md-9 d-flex align-items-end justify-content-end">
                        <button type="button" class="btn btn-secondary me-2" onclick="limparFormulario()">Cancelar</button>
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>
                </div>
            </form>
            <div id="formMsg" class="mt-3 font-weight-bold"></div>
        </div>
    </div>

    <!-- Seção de Importação de Arquivo -->
    <div class="card mb-4 shadow-sm border-primary">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Importar Dados Oficiais (CSV)</h5>
        </div>
        <div class="card-body d-flex flex-column flex-md-row align-items-center gap-3">
            <input type="file" id="fileInput" class="form-control w-auto flex-grow-1" accept=".csv">
            <button class="btn btn-primary px-4" onclick="importarDados()">Importar</button>
        </div>
        <div class="card-footer bg-white">
            <div id="importMsg" class="font-weight-bold"></div>
        </div>
    </div>

    <div class="row">
        <!-- Tabela e Filtros -->
        <div class="col-lg-8">

            <div class="card mb-4 shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Consultar Registros</h5>
                    <span class="badge bg-secondary" id="contadorRegistros">0 registros</span>
                </div>
                <div class="card-body">

                    <!-- Busca por ID -->
                    <div class="input-group mb-3">
                        <input type="number" id="buscaId" class="form-control" placeholder="Buscar por ID Exato">
                        <button class="btn btn-outline-primary" onclick="buscarPorId()">Buscar ID</button>
                    </div>

                    <!-- Dois Filtros do Domínio -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-5">
                            <input type="text" id="filtroUf" class="form-control" placeholder="Filtrar por UF (Ex: SP)">
                        </div>
                        <div class="col-md-5">
                            <input type="text" id="filtroTipo" class="form-control" placeholder="Filtrar por Tipo (Ex: HOSPITAL)">
                        </div>
                        <div class="col-md-2 d-grid">
                            <button class="btn btn-secondary" onclick="aplicarFiltro()">Filtrar</button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <button class="btn btn-outline-secondary btn-sm" onclick="carregarDados()">Limpar Filtros e Recarregar Todos</button>
                    </div>

                    <!-- Tabela -->
                    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark sticky-top">
                            <tr>
                                <th>ID</th>
                                <th>CNES</th>
                                <th>Nome</th>
                                <th>UF</th>
                                <th>Tipo</th>
                                <th>SUS</th>
                                <th>Ações</th>
                            </tr>
                            </thead>
                            <tbody id="tabelaCorpo">
                            <!-- Preenchido via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Visualização Gráfica -->
        <div class="col-lg-4">
            <div class="card shadow-sm sticky-top" style="top: 20px;">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Distribuição por UF</h5>
                    <small class="text-muted">Proporção de estabelecimentos por estado</small>
                </div>
                <div class="card-body">
                    <canvas id="ufChart" width="400" height="400"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script da Aplicação (App.js integrado ou referenciado) -->
<script src="js/app.js"></script>
</body>
</html>
